<style>
body {
    overflow: hidden;
    background: #000;
    margin: 0;
    color: #000;
}

#startButton {
    display: block;
    width: 160px;
    height: 40px;
    background-color: #4CAF50;
    color: white;
    text-align: center;
    font-size: 16px;
    margin: 20px auto;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-family: 'Press Start 2P', cursive;
    box-shadow: 0 0 10px 2px #000;
}

#sidebarad1,
#sidebarad2 {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 160px;
    height: 600px;
    z-index: 999999;
}

#sidebarad1 {
    left: 0;
}

#sidebarad2 {
    right: 0;
}

.sidebar-close {
    position: absolute;
    top: 0;
    right: 0;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    background: rgba(0,0,0,0.7);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
    z-index: 10;
}

    width: 160px;
    height: 600px;
    border: none;

<div style="width:100vw; height:100vh; max-width:100%">
    <div id="game" style="display:none;"></div>
    <button id="startButton">PLAY</button>
</div>

<script>
document.getElementById("game").style.display = "none";

function startGame() {
    document.getElementById("game").style.display = "block";
    document.getElementById("startButton").style.display = "none";

    EJS_player = "#game";
    EJS_core = "nes";
    EJS_color = "#000000";
    EJS_startOnLoaded = true;

    EJS_pathtodata =
        "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data";

    EJS_gameUrl =
        "https://cdn.jsdelivr.net/gh/bubbls/UGS-file-encryption@e0c78a58432c6486ebe1a50a78d263df65809a83/Super%20Mario%20Bros.%20(Europe).zip";

    loadGame();
}

document.getElementById("startButton")
    .addEventListener("click", startGame);

function loadGame() {

    let script1 = document.createElement("script");
    script1.src =
        "https://cdn.jsdelivr.net/gh/a456pur/seraph@81f551ca0aa8e3d6018d32d8ac5904ac9bc78f76/storage/emulatorjs/data/loader.js";
    document.body.appendChild(script1);

        "https://cdn.jsdelivr.net/gh/a456pur/seraph@ae2fcc6d6a9cd051654fcc0519080db1f79cf2a7/storage/js/cloak.js";
    document.body.appendChild(script2);
}
